<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registrar Tarefa</title>
  <link rel="stylesheet" href="./static/popup.css">
</head>
<body>
  <h3>Registrar Tarefa</h3>
  
  <div class="form-group">
    <label>Data:</label> 
    <input type="date" id="data">
  </div>
  
  <div class="row-horas">
    <div class="col-hora">
      <label>Hora Entrada:</label> 
      <input type="time" id="horaEntrada">
    </div>
    <div class="col-hora">
      <label>Hora Saída:</label> 
      <input type="time" id="horaSaida">
    </div>
  </div>
  
  <div class="form-group">
    <label>Cliente:</label> 
    <div class="row-input-dots">
      <input type="text" id="cliente" list="listaClientes" placeholder="Selecione ou digite...">
      <datalist id="listaClientes"></datalist>
      <button id="btnGerenciarClientes" class="btn-dots" title="Gerenciar clientes">⋮</button>
    </div>
  </div>

  <!-- NOVO CAMPO: PROJETO -->
  <div class="form-group">
    <label>Código do Projeto:</label> 
    <div class="row-input-dots">
      <input type="text" id="projeto" list="listaProjetos" placeholder="Código (Ex: PRJ-01)">
      <datalist id="listaProjetos"></datalist>
      <button id="btnGerenciarProjetos" class="btn-dots" title="Gerenciar projetos">⋮</button>
    </div>
  </div>
  
  <div class="form-group">
    <label>Descrição da Tarefa:</label> 
    <textarea id="descricao" placeholder="O que foi desenvolvido?"></textarea>
  </div>

  <button id="btnSalvar" class="btn-salvar">Salvar Tarefa</button>
  <button id="btnHistorico" class="btn-historico">Abrir Histórico</button>

  <div id="mensagemSucesso">Tarefa salva com sucesso!</div>

  <!-- Modal Clientes -->
  <dialog id="modalGerenciar">
    <h3>Gerenciar Clientes</h3>
    <div class="add-row" style="flex-wrap: nowrap;">
      <input type="text" id="inputNomeCliente" placeholder="Adicionar novo..." style="min-width: auto;">
      <button id="btnSalvarCliente" class="btn-salvar" style="width: auto;">Salvar</button>
    </div>
    <ul id="ulClientesGerenciar" class="lista-gerenciar"></ul>
    <div class="btn-row">
      <button id="btnFecharGerenciar" class="btn-fechar">Fechar</button>
    </div>
  </dialog>

  <!-- NOVO MODAL: PROJETOS -->
  <dialog id="modalProjetos">
    <h3>Gerenciar Projetos</h3>
    <div class="add-row">
      <input type="text" id="inputCodigoProj" placeholder="Código (Ex: PRJ-01)">
      <input type="text" id="inputDescProj" placeholder="Descrição do Projeto">
      <button id="btnSalvarProj" class="btn-salvar">Salvar Projeto</button>
    </div>
    <ul id="ulProjetosGerenciar" class="lista-gerenciar"></ul>
    <div class="btn-row">
      <button id="btnFecharProjetos" class="btn-fechar">Fechar</button>
    </div>
  </dialog>

  <script src="./static/popup.js"></script>
</body>
</html>
