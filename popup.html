<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registrar Tarefa</title>
  <link rel="stylesheet" href="./static/popup.css">
</head>
<body>

  <h3>✨ Apontamento de Horas</h3>

  <div class="form-group">
    <label>Data:</label>
    <input type="date" id="data">
  </div>

  <div class="row">
    <div class="form-group flex-1">
      <label>Entrada:</label>
      <div class="input-with-btn">
        <input type="time" id="horaEntrada">
        <button id="btnAgoraEntrada" class="btn-agora" title="Preencher com a hora atual">⏱️</button>
      </div>
    </div>
    <div class="form-group flex-1">
      <label>Saída:</label>
      <div class="input-with-btn">
        <input type="time" id="horaSaida">
        <button id="btnAgoraSaida" class="btn-agora" title="Preencher com a hora atual">⏱️</button>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>Cliente:</label>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="cliente" list="listaClientes" placeholder="Selecione ou digite...">
      <datalist id="listaClientes"></datalist>
      <button id="btnGerenciarClientes" class="btn-secondary-small" title="Gerenciar Clientes">⚙️</button>
    </div>
  </div>

  <div class="form-group">
    <label>Projeto:</label>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="projeto" list="listaProjetos" placeholder="Ex: PRJ-01">
      <datalist id="listaProjetos"></datalist>
      <button id="btnGerenciarProjetos" class="btn-secondary-small" title="Gerenciar Projetos">⚙️</button>
    </div>
  </div>

  <div class="form-group">
    <label>Descrição:</label>
    <textarea id="descricao" placeholder="O que desenvolveu hoje?..."></textarea>
  </div>

  <div id="mensagemSucesso">🎉 Tarefa registada com sucesso!</div>

  <div class="btn-block">
    <button id="btnSalvar" class="btn-primary">💾 Salvar Registo</button>
    <button id="btnHistorico" class="btn-secondary">🕒 Ver Histórico Completo</button>
  </div>

  <dialog id="modalGerenciar">
    <label style="font-weight: 600; font-size: 14px; margin-bottom: 5px; display: block;">Cadastrar Cliente:</label>
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <input type="text" id="inputNomeCliente" placeholder="Nome do cliente...">
      <button id="btnSalvarCliente" class="btn-primary-small">+</button>
    </div>
    <ul id="ulClientesGerenciar" class="lista-gerenciar"></ul>
    <button id="btnFecharGerenciar" class="btn-secondary">Fechar</button>
  </dialog>

  <dialog id="modalProjetos">
    <label style="font-weight: 600; font-size: 14px; margin-bottom: 5px; display: block;">Cadastrar Projeto:</label>
    <input type="text" id="inputCodigoProj" placeholder="Código (Ex: PRJ-01)" style="margin-bottom:8px;">
    <input type="text" id="inputDescProj" placeholder="Descrição (Ex: App Android)" style="margin-bottom:12px;">
    <button id="btnSalvarProj" class="btn-primary" style="margin-bottom: 15px;">Salvar Projeto</button>
    
    <ul id="ulProjetosGerenciar" class="lista-gerenciar"></ul>
    <button id="btnFecharProjetos" class="btn-secondary">Fechar</button>
  </dialog>

  <script src="./static/popup.js"></script>
</body>
</html>
